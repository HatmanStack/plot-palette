name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - '.cspell.json'
      - '.github/workflows/docs.yml'

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24.0.0
        with:
          globs: '**/*.md #node_modules #.pytest_cache'

      - name: Spell check
        uses: streetsidesoftware/cspell-action@de2a73e963e7443969755b648a1008f77033c5b2 # v8
        with:
          files: '**/*.md'
          config: '.cspell.json'

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: '--no-progress --exclude-path node_modules --exclude-path .pytest_cache **/*.md'
          fail: true
